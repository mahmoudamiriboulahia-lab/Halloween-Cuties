name: MacFree iOS -> TestFlight
on:
  workflow_dispatch:
  push:
    branches: [ main ]
concurrency:
  group: macfree-ios
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          # game-ci's Unity iOS image (~28 GB unpacked) plus the build overflow
          # the ~21 GB free on ubuntu-latest, and Docker dies with "no space
          # left on device" while unpacking a layer. Delete preinstalled
          # toolchains we never use and stale images to reclaim ~30 GB before
          # the image is pulled. '|| true' so a missing path never fails setup.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: iOS
          buildMethod: MacFree.Editor.MacFreeCiBuild.Run
          allowDirtyBuild: true
      - name: Package Xcode project
        run: |
          # upload-artifact drops every file's executable bit, but the archive
          # later runs Unity's build tools (usymtool, MapFileParser, ...) from
          # inside the project. Tarring here carries each file's mode intact
          # through the round trip, so nothing is left non-executable on macOS.
          tar -cf xcode-project.tar build/iOS
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tar
          retention-days: 1
  ship:
    needs: build
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          # Apple rejects uploads built with an SDK below its current floor
          # (e.g. "must be built with the iOS 26 SDK or later"), but the runner
          # defaults to an older Xcode. Pick the newest Xcode installed, so the
          # archive uses the latest SDK and this keeps working as the floor rises.
          xc=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xc" ]; then echo "No Xcode found on the runner" >&2; exit 1; fi
          sudo xcode-select -s "$xc/Contents/Developer"
          xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: .
      - name: Unpack Xcode project
        run: |
          # Restores build/iOS with every executable bit intact (see the
          # Package step in the build job), so xcodebuild's script phases can
          # run Unity's tools instead of dying on "Permission denied" minutes
          # into the 10x-billed macOS job.
          tar -xf xcode-project.tar
      - name: Import signing
        env:
          P12_B64: ${{ secrets.MACFREE_P12_BASE64 }}
          P12_PW: ${{ secrets.MACFREE_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.MACFREE_PROFILE_BASE64 }}
        run: |
          echo "$P12_B64" | base64 -d > /tmp/cert.p12
          echo "$PROFILE_B64" | base64 -d > /tmp/pp.mobileprovision
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          # Disable the keychain's default 5-minute auto-lock. The archive
          # compiles for several minutes before it codesigns, and a re-locked
          # keychain makes codesign hang forever on a GUI unlock prompt that a
          # headless runner can never answer (the job just burns to timeout).
          security set-keychain-settings build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PW" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/pp.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: Archive and export IPA
        env:
          TEAM_ID: ${{ secrets.MACFREE_TEAM_ID }}
        run: |
          XC=$(ls -d build/iOS/Unity-iPhone.xcodeproj build/iOS/*/Unity-iPhone.xcodeproj 2>/dev/null | head -1)
          if [ -z "$XC" ]; then
            echo "MacFree: could not find Unity-iPhone.xcodeproj under build/iOS (artifact download or Unity build layout changed)" >&2
            exit 1
          fi
          # The per-target provisioning profile is baked into the Xcode
          # project by MacFree's post-process hook (it must go on the app
          # target only, never the framework). Here we pass just the team and
          # the signing identity, which are valid for every target. Derive the
          # identity from the imported cert so its exact name never matters.
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -nE 's/.*"([^"]+)".*/\1/p' | head -1)
          xcodebuild -project "$XC" -scheme Unity-iPhone -sdk iphoneos -configuration Release -archivePath /tmp/app.xcarchive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$IDENTITY" archive
          xcodebuild -exportArchive -archivePath /tmp/app.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath /tmp/out
      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.MACFREE_ASC_KEY_ID }}
          ISSUER: ${{ secrets.MACFREE_ASC_ISSUER_ID }}
          KEY_B64: ${{ secrets.MACFREE_ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$KEY_B64" | base64 -d > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f /tmp/out/*.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
